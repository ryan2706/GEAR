  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>

  <script>
    const keyOptions = ["A","A#","Bb","B","C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab"];

    // --- Transpose utility (unchanged logic, just modern JS formatting) ---
    const transposeUtil = (() => {
      const keys = [
        { name: 'Ab', value: 0, type: 'F' },
        { name: 'A', value: 1, type: 'N' },
        { name: 'A#', value: 2, type: 'S' },
        { name: 'Bb', value: 2, type: 'F' },
        { name: 'B', value: 3, type: 'N' },
        { name: 'C', value: 4, type: 'N' },
        { name: 'C#', value: 5, type: 'S' },
        { name: 'Db', value: 5, type: 'F' },
        { name: 'D', value: 6, type: 'N' },
        { name: 'D#', value: 7, type: 'S' },
        { name: 'Eb', value: 7, type: 'F' },
        { name: 'E', value: 8, type: 'N' },
        { name: 'F', value: 9, type: 'N' },
        { name: 'F#', value: 10, type: 'S' },
        { name: 'Gb', value: 10, type: 'F' },
        { name: 'G', value: 11, type: 'N' },
        { name: 'G#', value: 0, type: 'S' }
      ];

      const chordRegex = /^[A-G][b\#]?(2|4|5|6|7|9|11|13|6\/9|7\-5|7\-9|7\#5|7\#9|7\+5|7\+9|7b5|7b9|7sus2|7sus4|add2|add4|add9|aug|dim|dim7|m\/maj7|m6|m7|m7b5|m9|m11|m13|maj7|maj9|maj11|maj13|mb5|m|sus|sus2|sus4|M7|\+)*(\/[A-G][b\#]*)*$/;
      const chordReplaceRegex = /([A-G][b\#]?(2|4|5|6|7|9|11|13|6\/9|7\-5|7\-9|7\#5|7\#9|7\+5|7\+9|7b5|7b9|7sus2|7sus4|add2|add4|add9|aug|dim|dim7|m\/maj7|m6|m7|m7b5|m9|m11|m13|maj7|maj9|maj11|maj13|mb5|m|sus|sus2|sus4|M7|\+)*)/g;

      function getKeyByName(name) {
        if (name.endsWith('m')) name = name.slice(0, -1);
        return keys.find(k => k.name === name);
      }
      function getChordRoot(input) {
        return (input.length > 1 && (input[1] === 'b' || input[1] === '#')) ? input.substr(0,2) : input.substr(0,1);
      }
      function getNewKey(oldKey, delta, targetKey) {
        let keyValue = getKeyByName(oldKey).value + delta;
        if (keyValue > 11) keyValue -= 12;
        else if (keyValue < 0) keyValue += 12;
        let i = 0;
        if ([0,2,5,7,10].includes(keyValue)) {
          switch (targetKey.name) {
            case 'A': case 'A#': case 'B': case 'C': case 'C#': case 'D': case 'D#': case 'E': case 'F#': case 'G': case 'G#':
              for (; i<keys.length; i++) if (keys[i].value === keyValue && keys[i].type === 'S') return keys[i];
            default:
              for (i=0; i<keys.length; i++) if (keys[i].value === keyValue && keys[i].type === 'F') return keys[i];
          }
        } else {
          for (; i<keys.length; i++) if (keys[i].value === keyValue) return keys[i];
        }
      }
      function getDelta(oldVal, newVal) {
        if (oldVal > newVal) return -(oldVal - newVal);
        if (oldVal < newVal) return newVal - oldVal;
        return 0;
      }
      function isChordLine(line) {
        const tokens = line.trim().split(/\s+/);
        if (!tokens.length || tokens[0] === '') return false;
        return tokens.every(t => chordRegex.test(t));
      }
      function isChord(token) { return chordRegex.test(token); }
      function transposeLine(line, delta, targetKey) {
        return line.replace(chordReplaceRegex, (match) => {
          const root = getChordRoot(match);
          const newRoot = getNewKey(root, delta, targetKey).name;
          return newRoot + match.slice(root.length);
        });
      }
      function transposeContent(text, originalKey, targetKeyName) {
        const oldKey = getKeyByName(originalKey);
        const newKey = getKeyByName(targetKeyName);
        if (!oldKey || !newKey) return text;
        const delta = getDelta(oldKey.value, newKey.value);
        return text.split(/\r?\n/).map(line => isChordLine(line) ? transposeLine(line, delta, newKey) : line).join("\n");
      }
      return { transposeContent, isChord };
    })();

    function isSectionLine(line) {
      return line.startsWith('[') && line.endsWith(']');
    }

    async function init() {
      const tbody = document.getElementById("songRows");

      // Pull song list from the upgraded search.html
      const songList = await fetch("search.html")
        .then(res => res.text())
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");
          // NEW selector for Bootstrap 5 list: <div id="myUL" class="list-group"><a class="list-group-item ...">
          const links = Array.from(doc.querySelectorAll("#myUL a.list-group-item"));
          return links.map(link => ({
            title: link.textContent.trim(),
            path: link.getAttribute("href").replace("../", "")
          }));
        });

      // Build 10 rows
      for (let i = 1; i <= 10; i++) {
        const tr = document.createElement("tr");

        // Song Title select
        const tdTitle = document.createElement("td");
        const selTitle = document.createElement("select");
        selTitle.className = "form-select";
        selTitle.id = `title${i}`;

        selTitle.appendChild(new Option("", ""));
        songList.forEach(song => selTitle.appendChild(new Option(song.title, song.path)));
        tdTitle.appendChild(selTitle);

        // Key select
        const tdKey = document.createElement("td");
        const selKey = document.createElement("select");
        selKey.className = "form-select";
        selKey.id = `key${i}`;
        selKey.appendChild(new Option("", ""));
        keyOptions.forEach(k => selKey.appendChild(new Option(k, k)));
        tdKey.appendChild(selKey);

        // Auto-fill key on title change
        selTitle.addEventListener("change", async () => {
          const selectedPath = selTitle.value;
          if (!selectedPath) { selKey.value = ""; return; }
          try {
            const res = await fetch(selectedPath);
            const text = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, "text/html");
            const pre = doc.querySelector("pre[data-key]");
            selKey.value = pre ? pre.getAttribute("data-key") : "";
          } catch { selKey.value = ""; }
        });

        tr.appendChild(tdTitle);
        tr.appendChild(tdKey);
        tbody.appendChild(tr);
      }

      // Generate .docx
      document.getElementById("generate").addEventListener("click", async () => {
        const { Document, Packer, Paragraph, TextRun } = docx;
        const children = [];

        for (let i = 1; i <= 10; i++) {
          const selTitle = document.getElementById(`title${i}`);
          if (selTitle.selectedIndex > 0) {
            const title = selTitle.options[selTitle.selectedIndex].text.trim();
            const selKey = document.getElementById(`key${i}`);
            const targetKey = (selKey.value || "").trim();
            const path = selTitle.value;

            try {
              const res = await fetch(path);
              const html = await res.text();
              const parser = new DOMParser();
              const doc = parser.parseFromString(html, "text/html");
              const pre = doc.querySelector("pre[data-key]");
              const originalKey = pre ? pre.getAttribute("data-key") : "";
              const content = pre ? pre.textContent : "";
              const transposed = transposeUtil.transposeContent(content, originalKey, targetKey || originalKey);

              // Title (uppercase + bold)
              children.push(new Paragraph({
                children: [ new TextRun({ text: `${title} [${targetKey || originalKey}]`.toUpperCase(), bold: true }) ]
              }));
              children.push(new Paragraph({}));

              // Body with chords bolded and section lines bolded
              transposed.split(/\r?\n/).forEach(line => {
                const trimmed = line.trim();
                if (isSectionLine(trimmed)) {
                  children.push(new Paragraph({ children: [ new TextRun({ text: trimmed, bold: true }) ], spacing: { after: 0 } }));
                } else {
                  const tokens = line.split(/(\s+)/).filter(t => t !== '');
                  const runs = tokens.map(tok => new TextRun({ text: tok, bold: transposeUtil.isChord(tok) }));
                  children.push(new Paragraph({ children: runs, spacing: { after: 0 } }));
                }
              });
              children.push(new Paragraph({}));
            } catch { /* ignore this song if fetch/parse fails */ }
          }
        }

        if (children.length === 0) {
          alert("Please select at least one song.");
          return;
        }

        const docOut = new Document({
          styles: {
            default: { document: { run: { font: "Courier New" } } }
          },
          sections: [{
            properties: {
              page: { margin: { top: 720, right: 720, bottom: 720, left: 720 } },
              column: { space: 708, count: 2 }
            },
            children
          }]
        });

        const blob = await Packer.toBlob(docOut);
        saveAs(blob, "songs.docx");
      });
    }

    init();
  </script>
</body>
