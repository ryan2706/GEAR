<!DOCTYPE html>
<html lang="en">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Generate Chord Chart - GEAR</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    footer { margin-top: auto; }
    select.form-select:hover {
      border-color: #0d6efd;
      box-shadow: 0 0 5px rgba(13,110,253,.35);
      transition: all .2s ease-in-out;
    }
    .table thead th { font-weight: 600; }
    .actions-col { width: 1%; white-space: nowrap; }
    .reorder-col { width: 1%; white-space: nowrap; }
    .drag-handle {
      cursor: grab;
      user-select: none;
    }
    tr.dragging {
      opacity: .5;
    }
    /* show drop position */
    tbody tr.drop-above { box-shadow: 0 -2px 0 #0d6efd inset; }
    tbody tr.drop-below { box-shadow: 0  2px 0 #0d6efd inset; }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">GEAR</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html" title="Home"><i class="bi bi-house"></i></a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="aboutDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">ABOUT</a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="aboutDropdown">
              <li><a class="dropdown-item" href="about/aboutSite.html"><i class="bi bi-question-circle me-2"></i>About Site</a></li>
              <li><a class="dropdown-item" href="about/aboutCOTL.html"><i class="bi bi-info-circle me-2"></i>About COTL</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="generateDoc.html" title="Generate Document"><i class="bi bi-file-earmark-text"></i></a></li>
          <li class="nav-item"><a class="nav-link" href="search.html" title="Search Song Titles"><i class="bi bi-search"></i></a></li>
        </ul>
      </div>
    </div>

  <!-- Page -->
  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-sm">
          <div class="card-header text-center">
            <h5 class="card-title mb-0">
              <i class="bi bi-music-note-beamed me-2"></i>Song Selection
            </h5>
          </div>

          <div class="card-body">
            <div class="d-flex gap-2 justify-content-between align-items-center mb-3">
              <div class="text-body-secondary small">Add songs, drag to reorder, and (optionally) transpose their keys.</div>
              <div class="d-flex gap-2">
                <button id="addRow" class="btn btn-outline-primary btn-sm">
                  <i class="bi bi-plus-lg me-1"></i>Add row
                </button>
                <button id="clearAll" class="btn btn-outline-secondary btn-sm">
                  <i class="bi bi-eraser me-1"></i>Clear all
                </button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-bordered table-striped align-middle mb-3">
                <thead class="table-light">
                  <tr>
                    <th class="text-center reorder-col"><i class="bi bi-arrows-move" title="Drag to reorder"></i></th>
                    <th class="text-center" style="width:70%">Song Title</th>
                    <th class="text-center" style="width:25%">Key</th>
                    <th class="text-center actions-col">Actions</th>
                  </tr>
                </thead>
                <tbody id="songRows"></tbody>
              </table>
            </div>

            <div class="text-center">
              <button id="generate" class="btn btn-primary btn-lg">
                <i class="bi bi-download me-2"></i>Generate Chord Chart
              </button>
            </div>
          </div>
        </div>

        <p class="text-end text-body-secondary mt-3 mb-0">GEAR 2</p>
      </div>
    </div>
  </main>

  <footer></footer>

  <!-- JS libs -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>

  <script>
    const INITIAL_ROWS = 5;
    const MAX_ROWS = 40;
    const keyOptions = ["A","A#","Bb","B","C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab"];
    let songList = [];
    let rowCounter = 0;

    // --- Transpose + helpers ---
    const transposeUtil = (() => {
      const keys = [
        { name: 'Ab', value: 0, type: 'F' },{ name: 'A', value: 1, type: 'N' },
        { name: 'A#', value: 2, type: 'S' },{ name: 'Bb', value: 2, type: 'F' },
        { name: 'B', value: 3, type: 'N' },{ name: 'C', value: 4, type: 'N' },
        { name: 'C#', value: 5, type: 'S' },{ name: 'Db', value: 5, type: 'F' },
        { name: 'D', value: 6, type: 'N' },{ name: 'D#', value: 7, type: 'S' },
        { name: 'Eb', value: 7, type: 'F' },{ name: 'E', value: 8, type: 'N' },
        { name: 'F', value: 9, type: 'N' },{ name: 'F#', value: 10, type: 'S' },
        { name: 'Gb', value: 10, type: 'F' },{ name: 'G', value: 11, type: 'N' },
        { name: 'G#', value: 0, type: 'S' }
      ];
      const chordRegex = /^[A-G][b\#]?(2|4|5|6|7|9|11|13|6\/9|7\-5|7\-9|7\#5|7\#9|7\+5|7\+9|7b5|7b9|7sus2|7sus4|add2|add4|add9|aug|dim|dim7|m\/maj7|m6|m7|m7b5|m9|m11|m13|maj7|maj9|maj11|maj13|mb5|m|sus|sus2|sus4|M7|\+)*(\/[A-G][b\#]*)*$/;
      const chordReplaceRegex = /([A-G][b\#]?(2|4|5|6|7|9|11|13|6\/9|7\-5|7\-9|7\#5|7\#9|7\+5|7\+9|7b5|7b9|7sus2|7sus4|add2|add4|add9|aug|dim|dim7|m\/maj7|m6|m7|m7b5|m9|m11|m13|maj7|maj9|maj11|maj13|mb5|m|sus|sus2|sus4|M7|\+)*)/g;
      function getKeyByName(name){ if(name.endsWith('m')) name=name.slice(0,-1); return keys.find(k=>k.name===name); }
      function getChordRoot(input){ return (input.length>1&&(input[1]==='b'||input[1]==='#'))?input.substr(0,2):input.substr(0,1); }
      function getNewKey(oldKey, delta, targetKey){
        let keyValue = getKeyByName(oldKey).value + delta;
        if (keyValue > 11) keyValue -= 12; else if (keyValue < 0) keyValue += 12;
        if ([0,2,5,7,10].includes(keyValue)) {
          switch (targetKey.name) {
            case 'A': case 'A#': case 'B': case 'C': case 'C#': case 'D': case 'D#': case 'E': case 'F#': case 'G': case 'G#':
              for (let i=0;i<keys.length;i++) if (keys[i].value===keyValue && keys[i].type==='S') return keys[i];
            default:
              for (let i=0;i<keys.length;i++) if (keys[i].value===keyValue && keys[i].type==='F') return keys[i];
          }
        } else {
          for (let i=0;i<keys.length;i++) if (keys[i].value===keyValue) return keys[i];
        }
      }
      function getDelta(o,n){ if(o>n) return -(o-n); if(o<n) return n-o; return 0; }
      function isChordLine(line){ const t=line.trim().split(/\s+/); if(!t.length||t[0]==='') return false; return t.every(x=>chordRegex.test(x)); }
      function isChord(tok){ return chordRegex.test(tok); }
      function transposeLine(line, delta, targetKey){
        return line.replace(chordReplaceRegex,(m)=>{ const r=getChordRoot(m); const nr=getNewKey(r,delta,targetKey).name; return nr+m.slice(r.length); });
      }
      function transposeContent(text, originalKey, targetKeyName){
        const oldKey=getKeyByName(originalKey), newKey=getKeyByName(targetKeyName||originalKey);
        if(!oldKey||!newKey) return text;
        const delta=getDelta(oldKey.value,newKey.value);
        return text.split(/\r?\n/).map(line=>isChordLine(line)?transposeLine(line,delta,newKey):line).join("\n");
      }
      return { transposeContent, isChord };
    })();
    function isSectionLine(line){ return line.startsWith('[') && line.endsWith(']'); }

    // --- Row helpers ---
    function createSelect(options, placeholder=""){
      const sel = document.createElement("select");
      sel.className = "form-select";
      sel.appendChild(new Option(placeholder, ""));
      options.forEach(opt => sel.appendChild(new Option(opt.text || opt, opt.value || opt)));
      return sel;
    }

    function addDragBehaviour(tr){
      tr.draggable = true;
      tr.addEventListener("dragstart", (e) => {
        tr.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });
      tr.addEventListener("dragend", () => {
        tr.classList.remove("dragging");
        document.querySelectorAll("#songRows tr").forEach(r => r.classList.remove("drop-above","drop-below"));
      });
      tr.addEventListener("dragover", (e) => {
        e.preventDefault(); // allow drop
        const dragging = document.querySelector("#songRows tr.dragging");
        if (!dragging || dragging === tr) return;

        const bbox = tr.getBoundingClientRect();
        const midpoint = bbox.top + bbox.height / 2;
        const tbody = document.getElementById("songRows");

        // Visual indicator
        document.querySelectorAll("#songRows tr").forEach(r => r.classList.remove("drop-above","drop-below"));
        if (e.clientY < midpoint) tr.classList.add("drop-above"); else tr.classList.add("drop-below");

        // Reinsert on the fly for smoothness
        if (e.clientY < midpoint) tbody.insertBefore(dragging, tr);
        else tbody.insertBefore(dragging, tr.nextSibling);
      });
    }

    function createRow(){
      if (document.querySelectorAll("#songRows tr").length >= MAX_ROWS) {
        alert(`Maximum of ${MAX_ROWS} rows reached.`);
        return;
      }

      rowCounter++;
      const tr = document.createElement("tr");
      tr.dataset.rowId = rowCounter;

      // Reorder handle
      const tdHandle = document.createElement("td");
      tdHandle.className = "text-center";
      tdHandle.innerHTML = '<span class="drag-handle" title="Drag to reorder"><i class="bi bi-grip-vertical"></i></span>';

      // Title
      const tdTitle = document.createElement("td");
      const titleSel = createSelect(songList.map(s => ({text:s.title, value:s.path})));
      titleSel.id = `title-${rowCounter}`;
      tdTitle.appendChild(titleSel);

      // Key
      const tdKey = document.createElement("td");
      const keySel = createSelect(keyOptions, "");
      keySel.id = `key-${rowCounter}`;
      tdKey.appendChild(keySel);

      // Actions
      const tdAct = document.createElement("td");
      tdAct.className = "text-center";
      const delBtn = document.createElement("button");
      delBtn.className = "btn btn-outline-danger btn-sm";
      delBtn.innerHTML = '<i class="bi bi-trash"></i>';
      delBtn.type = "button";
      delBtn.addEventListener("click", () => tr.remove());
      tdAct.appendChild(delBtn);

      // Auto-fill key when picking a title
      titleSel.addEventListener("change", async () => {
        const path = titleSel.value;
        if (!path) { keySel.value = ""; return; }
        try {
          const res = await fetch(path);
          const html = await res.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");
          const pre = doc.querySelector("pre[data-key]");
          keySel.value = pre ? pre.getAttribute("data-key") : "";
        } catch { keySel.value = ""; }
      });

      tr.appendChild(tdHandle);
      tr.appendChild(tdTitle);
      tr.appendChild(tdKey);
      tr.appendChild(tdAct);
      document.getElementById("songRows").appendChild(tr);

      // Activate drag & drop on this new row
      addDragBehaviour(tr);
    }

    function clearAllRows(){
      document.getElementById("songRows").innerHTML = "";
    }

    // --- Build and wire up page ---
    async function init(){
      // Load songs from search.html
      songList = await fetch("search.html")
        .then(r => r.text())
        .then(html => {
          const doc = new DOMParser().parseFromString(html, "text/html");
          const links = Array.from(doc.querySelectorAll("#myUL a")); // robust selector
          return links.map(a => ({
            title: a.textContent.trim(),
            path: new URL(a.getAttribute("href"), location.href).pathname
          }));
        })
        .catch(() => []);

      // Seed initial rows
      for (let i=0; i<INITIAL_ROWS; i++) createRow();

      // Buttons
      document.getElementById("addRow").addEventListener("click", createRow);
      document.getElementById("clearAll").addEventListener("click", clearAllRows);

      // Make existing rows draggable (already handled in createRow)
    }

    async function generateDoc(){
      const { Document, Packer, Paragraph, TextRun } = docx;
      const rows = Array.from(document.querySelectorAll("#songRows tr"));
      const children = [];

      for (const tr of rows){
        const titleSel = tr.querySelector("select[id^='title-']");
        if (!titleSel || !titleSel.value) continue;

        const title = titleSel.options[titleSel.selectedIndex].text.trim();
        const keySel = tr.querySelector("select[id^='key-']");
        const targetKey = (keySel.value || "").trim();
        const path = titleSel.value;

        try {
          const res = await fetch(path);
          const html = await res.text();
          const parser = new DOMParser();
          const hdoc = parser.parseFromString(html, "text/html");
          const pre = hdoc.querySelector("pre[data-key]");
          const originalKey = pre ? pre.getAttribute("data-key") : "";
          const content = pre ? pre.textContent : "";
          const finalKey = targetKey || originalKey;
          const transposed = transposeUtil.transposeContent(content, originalKey, finalKey);

          // Title (uppercase + bold)
          children.push(new Paragraph({
            children: [ new TextRun({ text: `${title} [${finalKey || originalKey}]`.toUpperCase(), bold: true }) ]
          }));
          children.push(new Paragraph({}));

          // Body with chords bolded and section lines bolded
          transposed.split(/\r?\n/).forEach(line => {
            const trimmed = line.trim();
            if (isSectionLine(trimmed)) {
              children.push(new Paragraph({ children: [ new TextRun({ text: trimmed, bold: true }) ], spacing: { after: 0 } }));
            } else {
              const tokens = line.split(/(\s+)/).filter(t => t !== '');
              const runs = tokens.map(tok => new TextRun({ text: tok, bold: transposeUtil.isChord(tok) }));
              children.push(new Paragraph({ children: runs, spacing: { after: 0 } }));
            }
          });
          children.push(new Paragraph({}));
        } catch (e) {
          console.warn("Failed to fetch/parse:", path, e);
        }
      }

      if (!children.length){
        alert("Please add at least one song.");
        return;
      }

      const docOut = new Document({
        styles: { default: { document: { run: { font: "Courier New" } } } },
        sections: [{
          properties: { page: { margin: { top: 720, right: 720, bottom: 720, left: 720 } }, column: { space: 708, count: 2 } },
          children
        }]
      });

      const blob = await Packer.toBlob(docOut);
      saveAs(blob, "songs.docx");
    }

    document.getElementById("generate").addEventListener("click", generateDoc);
    init();
  </script>
</body>
